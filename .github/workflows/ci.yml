name: CI

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MatcBuddy.sln

      - name: Build
        run: dotnet build MatcBuddy.sln -c Release --no-restore

      - name: Test
        run: dotnet test MatcBuddy.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Migration / model uyumu
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/MatcBuddy.DataAccess --startup-project src/MatcBuddy.Api -c Release --no-build
